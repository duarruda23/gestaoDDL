name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (tipos, lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão lida de package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Testes (Postgres em memória com PGlite)
        run: pnpm test
      - run: pnpm build

  banco:
    name: Banco (migrações + regras)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gestao_donas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d gestao_donas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/gestao_donas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrações batem com o schema
        run: pnpm db:check
      - name: Aplicar migrações
        run: pnpm db:migrate
      - name: Aplicar de novo não muda nada
        run: pnpm db:migrate
      - name: Testar regras do banco
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/teste-regras.sql
      - name: Operação do dono (rodar duas vezes não duplica)
        env:
          MIGRACAO_DATABASE_URL: ${{ env.DATABASE_URL }}
          SITE_URL: https://exemplo.test
          DONO_NOME: Ítalo
          DONO_EMAIL: italo@exemplo.test
          DONO_WHATSAPP: "+55 82 90000-0001"
          CONVIDADO_NOME: Eduardo
          CONVIDADO_EMAIL: eduardo@exemplo.test
        run: |
          mascarar() { sed -E 's#/convite/[A-Za-z0-9_-]+#/convite/<token>#g'; }
          saida1=$(node db/operacao-dono.mjs 2>&1) || { echo "$saida1" | mascarar; exit 1; }
          echo "$saida1" | mascarar
          echo "$saida1" | grep -q "Link de convite para eduardo@exemplo.test"
          saida2=$(node db/operacao-dono.mjs 2>&1) || { echo "$saida2" | mascarar; exit 1; }
          echo "$saida2" | mascarar
          echo "$saida2" | grep -q "Dono já existia"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from usuarios where dono')" = "1"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from frentes')" = "7"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from convites')" = "4"
          echo "ok: um dono, 7 frentes, 4 convites (2 do dono + 2 do convidado)"
