# Stack do Docker Swarm na VPS trafegodeloja (31.97.86.160), mesmo padrão do n8n:
# Traefik na rede overlay "trafegodeloja", entrypoint websecure, certresolver letsencryptresolver.
# Não rode direto: use infra/deploy.sh (constrói a imagem, roda as migrações e faz o deploy).
#
# O Postgres NÃO publica porta: só app, backup e a migração falam com ele,
# pela rede overlay "gestao-donas_interna".
#
# IMPORTANTE: o host do banco é "postgres." (com ponto final). A VPS tem
# "search localhost" no resolv.conf; o DNS do Docker não responde IPv6 para
# o serviço, então "postgres" (sem ponto) vira "postgres.localhost" = ::1 e a
# conexão cai na própria máquina. O ponto final impede o sufixo. (25/09/2026)

version: "3.8"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_donas
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
    volumes:
      - gestao_donas_pg_data:/var/lib/postgresql/data
      - /opt/gestao-ddl/infra/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gestao_donas"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 1G }

  app:
    image: gestao-donas-app:${VERSAO}
    environment:
      DATABASE_URL: postgres://${PG_APP_USER}:${PG_APP_PASSWORD}@postgres.:5432/gestao_donas
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      IA_PROVEDOR: ${IA_PROVEDOR}
      N8N_TOKEN: ${N8N_TOKEN}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO}
    networks: [interna, trafegodeloja]
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      update_config: { order: start-first, failure_action: rollback }
      resources:
        limits: { memory: 768M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=trafegodeloja
        - traefik.http.routers.gestao_donas.rule=Host(`${DOMINIO}`)
        - traefik.http.routers.gestao_donas.entrypoints=websecure
        - traefik.http.routers.gestao_donas.tls.certresolver=letsencryptresolver
        - traefik.http.routers.gestao_donas.service=gestao_donas
        - traefik.http.routers.gestao_donas.middlewares=gestao_donas_noindex
        - traefik.http.services.gestao_donas.loadbalancer.server.port=3000
        - traefik.http.middlewares.gestao_donas_noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive

  backup:
    image: postgres:17
    environment:
      PGHOST: postgres.
      PGDATABASE: gestao_donas
      PGUSER: ${PG_ADMIN_USER}
      PGPASSWORD: ${PG_ADMIN_PASSWORD}
      MANTER_DIAS: ${BACKUP_MANTER_DIAS}
    volumes:
      - gestao_donas_backups:/backups
      - /opt/gestao-ddl/infra/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [interna]
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 256M }

volumes:
  gestao_donas_pg_data:
  gestao_donas_backups:

networks:
  interna:
    driver: overlay
    attachable: true # deixa o container avulso da migração se conectar
  trafegodeloja:
    external: true
