# Produção na VPS pessoal do Eduardo (padrão Docker + Traefik, igual à VPS da Virgo).
# O Postgres NÃO publica porta: só o app e o backup falam com ele, pela rede interna.
# Antes de subir: ver infra/README.md (inventário da VPS, .env, rede do Traefik).

name: gestao-donas

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_donas
      POSTGRES_USER: ${PG_ADMIN_USER} # dono do banco: roda migrações e backup
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_APP_USER: ${PG_APP_USER} # lidos pelo script de postgres-init
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
    volumes:
      - gestao_donas_pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro # cria o usuário da aplicação
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gestao_donas"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Roda as migrações (usuário admin) e termina. O app só sobe depois.
  migrar:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: gestao-donas-app
    command: ["node", "db/migrar.mjs"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRACAO_DATABASE_URL: postgres://${PG_ADMIN_USER}:${PG_ADMIN_PASSWORD}@postgres:5432/gestao_donas
    networks: [interna]

  app:
    image: gestao-donas-app
    restart: unless-stopped
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${PG_APP_USER}:${PG_APP_PASSWORD}@postgres:5432/gestao_donas
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_PROVEDOR: ${IA_PROVEDOR:-}
      N8N_TOKEN: ${N8N_TOKEN} # segredo compartilhado com o n8n (ver docs de arquitetura)
      SESSAO_SEGREDO: ${SESSAO_SEGREDO}
    networks: [interna, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.gestao-donas.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.gestao-donas.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gestao-donas.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.gestao-donas.loadbalancer.server.port=3000
      - traefik.http.middlewares.gestao-donas-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive
      - traefik.http.routers.gestao-donas.middlewares=gestao-donas-noindex

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: gestao_donas
      PGUSER: ${PG_ADMIN_USER}
      PGPASSWORD: ${PG_ADMIN_PASSWORD}
      MANTER_DIAS: ${BACKUP_MANTER_DIAS:-14}
    volumes:
      - gestao_donas_backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [interna]

volumes:
  gestao_donas_pg_data:
  gestao_donas_backups:

networks:
  interna:
    internal: true # sem saída para a internet: Postgres e backup isolados
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
